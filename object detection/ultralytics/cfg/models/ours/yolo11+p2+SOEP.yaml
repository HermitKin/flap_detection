# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P2-P5 outputs + SOEP components for enhanced small object detection
# Fusion of YOLO-SOEP components into P2 branch for better tiny object detection

# Parameters
nc: 80  # number of classes
scales:
  # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024]  # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512]   # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512]   # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512]   # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2, [512, True]]     # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10

# YOLO11n head with SOEP fusion for enhanced P2 small object detection
head:
  # Top-down pathway
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]       # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]     # 13 TD P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]       # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]     # 16 TD P3

  # Enhanced P2 branch with SOEP components
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17 P3->P2
  - [2, 1, SPDConv, [128]]          # 18 SPD enhancement for P2 backbone features
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19 Upsample SPDConv to match P2 size
  - [[-1, 1], 1, Concat, [1]]       # 20 concat P2 backbone with SPD-enhanced features
  - [-1, 1, CSPOmniKernel, [128]]   # 21 OmniKernel for multi-scale feature learning
  - [-1, 2, C3k2, [128, False]]     # 22 TD P2 (P2/4-tiny) with enhanced features

  # Bottom-up pathway (PAN) starting from enhanced P2
  - [-1, 1, Conv, [128, 3, 2]]      # 23 down to P3
  - [[-1, 16], 1, Concat, [1]]      # 24 fuse with TD P3
  - [-1, 2, C3k2, [256, False]]     # 25 PAN P3

  - [-1, 1, Conv, [256, 3, 2]]      # 26 down to P4
  - [[-1, 13], 1, Concat, [1]]      # 27 fuse with TD P4
  - [-1, 2, C3k2, [512, False]]     # 28 PAN P4

  - [-1, 1, Conv, [512, 3, 2]]      # 29 down to P5
  - [[-1, 10], 1, Concat, [1]]      # 30 fuse with P5 context
  - [-1, 2, C3k2, [1024, True]]     # 31 PAN P5

  # Detection heads for all scales
  - [[22, 25, 28, 31], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)